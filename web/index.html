<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pawn Master — Merrick's</title>
  <meta name="description" content="Inherit a failing pawn shop. Appraise real antiques, spot the classic forgeries, and clear the debt.">
  <meta name="theme-color" content="#12100D">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Merrick's">
  <link rel="stylesheet" href="./css/theme.css">
</head>
<body>
  <div class="device">
    <div class="screen-frame">
      <div class="grain" aria-hidden="true"></div>

      <div class="chrome">
        <div class="topbar">
          <div class="wordmark">MERRICK'S</div>
          <div class="till" id="till">$0</div>
          <button class="tools-btn" id="toolsBtn" type="button">Tools</button>
          <button class="icon-btn" id="fsBtn" type="button" hidden aria-label="Full screen">⛶</button>
        </div>
        <div class="debt">
          <div class="debt-track"><div class="debt-fill" id="debtFill"></div></div>
          <div class="debt-label" id="debtLabel"></div>
        </div>
      </div>

      <div class="screen" id="screen"></div>
    </div>
  </div>

  <p class="caption">
    <b>Pawn Master</b> — you've inherited Sol Merrick's shop and his debt. Every antique across
    that counter has a story attached, and about a third of those stories are lies.
  </p>

  <script src="./js/data.js"></script>
  <script src="./js/art.js"></script>
  <script src="./js/core.js"></script>
  <script src="./js/ui.js"></script>
</body>
</html>
