<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pawn Master</title>
  <meta name="description" content="Inspect. Decide. Profit. A pocket-sized pawn shop haggling game.">
  <meta name="theme-color" content="#14110E">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pawn Master">
  <link rel="stylesheet" href="./css/theme.css">
</head>
<body>
  <div class="device">
    <div class="screen-frame">
      <div class="topbar">
        <div class="wordmark">PAWN MASTER</div>
        <div class="coins" id="coins">0</div>
        <button class="tools-btn" id="toolsBtn" type="button">Tools</button>
      </div>
      <div class="screen" id="screen"></div>
    </div>
  </div>

  <p class="caption">
    <b>Pawn Master</b> — inspect an item, decide what it's really worth, and haggle for the deal.
    Add it to your home screen to play offline.
  </p>

  <script src="./js/data.js"></script>
  <script src="./js/core.js"></script>
  <script src="./js/ui.js"></script>
</body>
</html>
