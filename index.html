<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawn Master — Merrick's</title>
<!-- This repo's playable game lives in /web/. When served by GitHub Pages
     from the repo root, this page forwards visitors to it so the bare
     Pages URL (…/Pawnshop/) opens the game. -->
<meta http-equiv="refresh" content="0; url=./web/">
<link rel="canonical" href="./web/">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(130% 80% at 50% 0%, #201a12 0%, #12100d 55%, #0b0906 100%);
    color: #e4dcc9;
    font-family: 'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
  }
  .name { font-size: 34px; letter-spacing: 0.22em; color: #d6b463; font-weight: 700; }
  .line { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8a806c; }
  a.play {
    margin-top: 8px; font-family: system-ui, sans-serif; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none;
    color: #1e1707; background: linear-gradient(180deg, #d6b463, #a07f34);
    padding: 14px 26px; border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="name">MERRICK'S</div>
  <div class="line">Pawn &amp; Loan · est. 1968</div>
  <a class="play" href="./web/">Enter the shop</a>
</body>
</html>
